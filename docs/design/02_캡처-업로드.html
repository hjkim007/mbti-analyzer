<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>너궁그매 스캐너 · 캡처 업로드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#64517f}a:hover{color:#242b29}
.mini{background:#ffffff;border-radius:2px 7px 7px 7px;height:9px}
.mini-me{background:#fee500;border-radius:7px 2px 7px 7px;height:9px;margin-left:auto}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f8f7f2; color: #242b29; font-family: 'Noto Sans KR', 'DM Sans', sans-serif; word-break: keep-all; display: flex; flex-direction: column; padding: 18px 20px 24px">

<div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6b6f6a">
<button type="button" style="font: inherit; font-size: 13px; color: #5f645e; background: none; border: 0; padding: 10px 0; min-height: 44px">← 처음으로</button>
<span>심층·관계 해석 · 1단계</span>
</div>

<div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px">
<div><div style="height: 3px; border-radius: 5px; background: #776398"></div><p style="margin: 7px 0 0; font-size: 10px; font-weight: 700; color: #64517f">캡처</p></div>
<div><div style="height: 3px; border-radius: 5px; background: #e3e3da"></div><p style="margin: 7px 0 0; font-size: 10px; color: #6b6f6a">관계</p></div>
<div><div style="height: 3px; border-radius: 5px; background: #e3e3da"></div><p style="margin: 7px 0 0; font-size: 10px; color: #6b6f6a">행동 7문항</p></div>
<div><div style="height: 3px; border-radius: 5px; background: #e3e3da"></div><p style="margin: 7px 0 0; font-size: 10px; color: #6b6f6a">메모</p></div>
<div><div style="height: 3px; border-radius: 5px; background: #e3e3da"></div><p style="margin: 7px 0 0; font-size: 10px; color: #6b6f6a">나 · 상황</p></div>
</div>

<h1 style="margin: 28px 0 0; font-size: 24px; line-height: 1.45; font-weight: 700; letter-spacing: -1px">그 사람과 나눈<br>카톡 화면을 올려주세요</h1>
<p style="margin: 10px 0 0; font-size: 13px; line-height: 1.8; color: #5f645e">상대의 말이 많이 보일수록 정확해져요. 최대 10장.</p>

<div style="margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px">
<div style="position: relative; aspect-ratio: 9 / 16; background: #c9d8e6; border-radius: 14px; border: 1px solid #b9cadb; padding: 12px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<div class="mini" style="width: 70%"></div><div class="mini" style="width: 50%"></div><div class="mini-me" style="width: 45%"></div><div class="mini" style="width: 80%"></div><div class="mini" style="width: 40%"></div><div class="mini-me" style="width: 60%"></div><div class="mini" style="width: 65%"></div>
<button type="button" aria-label="1번 캡처 삭제" style="position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #f8f7f2; background: #242b29; color: #ffffff; font-size: 13px; line-height: 1; padding: 0">×</button>
<span style="position: absolute; left: 6px; bottom: 6px; font-size: 10px; background: rgba(36,43,41,.8); color: #ffffff; border-radius: 6px; padding: 2px 6px">1</span>
</div>
<div style="position: relative; aspect-ratio: 9 / 16; background: #c9d8e6; border-radius: 14px; border: 1px solid #b9cadb; padding: 12px 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<div class="mini-me" style="width: 55%"></div><div class="mini" style="width: 75%"></div><div class="mini" style="width: 60%"></div><div class="mini" style="width: 35%"></div><div class="mini-me" style="width: 50%"></div><div class="mini" style="width: 70%"></div>
<button type="button" aria-label="2번 캡처 삭제" style="position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #f8f7f2; background: #242b29; color: #ffffff; font-size: 13px; line-height: 1; padding: 0">×</button>
<span style="position: absolute; left: 6px; bottom: 6px; font-size: 10px; background: rgba(36,43,41,.8); color: #ffffff; border-radius: 6px; padding: 2px 6px">2</span>
</div>
<label style="aspect-ratio: 9 / 16; border: 1.5px dashed #b5a4cb; border-radius: 14px; background: #fffefa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: #64517f">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span style="font-size: 12px; font-weight: 600">캡처 추가</span>
<span style="font-size: 10px; color: #6b6f6a">2 / 10</span>
<input type="file" accept="image/*" multiple="" style="display: none">
</label>
</div>

<div style="margin-top: 22px; background: #ecefe5; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 12px; font-weight: 700; color: #4f5d47">이런 캡처가 좋아요</p>
<p style="margin: 0; font-size: 12px; line-height: 1.75; color: #545d4f">· 상대가 길게 말한 부분, 약속을 잡는 장면<br>· 기쁠 때·서운할 때처럼 감정이 드러난 대화<br>· 이름·전화번호는 가리고 올려도 괜찮아요</p>
</div>

<div style="margin-top: auto; display: flex; gap: 10px">
<button type="button" style="font: inherit; flex: 1; min-height: 52px; border-radius: 12px; border: 1px solid #d9dbd1; background: transparent; font-size: 14px; font-weight: 600; color: #242b29">← 이전</button>
<button type="button" style="font: inherit; flex: 2; min-height: 52px; border-radius: 12px; border: 0; background: #242b29; color: #ffffff; font-size: 14px; font-weight: 700">다음 · 관계 선택 →</button>
</div>
</div>
</body>
</html>
